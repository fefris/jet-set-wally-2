// Asset registry: every data file registers sprites, tiles, items, tunes and rooms here.
// Loaded first so data files can call JSW.defineXxx(). Works as a classic browser script
// and inside a Node vm context (tools/load.js).
(function (JSW) {
  'use strict';

  JSW.sprites = JSW.sprites || {};   // 16x16 multi-frame sprites (Wally, guardians)
  JSW.tiles = JSW.tiles || {};       // 8x8 tile patterns
  JSW.itemGfx = JSW.itemGfx || {};   // 8x8 item (collectable) graphics
  JSW.tunes = JSW.tunes || {};       // beeper tunes
  JSW.rooms = JSW.rooms || {};       // room definitions keyed by id
  JSW.roomOrder = JSW.roomOrder || [];
  JSW.errors = JSW.errors || [];

  function fail(msg) {
    JSW.errors.push(msg);
    if (typeof console !== 'undefined') console.error('[JSW] ' + msg);
  }

  // Parse rows of '.'/'#' (or ' '/'X') into an array of row bitmasks (MSB = leftmost pixel).
  function parseBitmap(rows, w, h, what) {
    if (!Array.isArray(rows) || rows.length !== h) {
      fail(what + ': expected ' + h + ' rows, got ' + (rows && rows.length));
      rows = (rows || []).slice(0, h);
      while (rows.length < h) rows.push('');
    }
    return rows.map(function (r, i) {
      if (typeof r !== 'string') r = '';
      if (r.length !== w) fail(what + ': row ' + i + ' has width ' + r.length + ' (expected ' + w + ')');
      var bits = 0;
      for (var x = 0; x < w; x++) {
        var c = r.charAt(x);
        bits = bits * 2 + ((c === '#' || c === 'X' || c === '1' || c === '@') ? 1 : 0);
      }
      return bits;
    });
  }
  JSW.parseBitmap = parseBitmap;

  // Sprite: { frames: [[16 rows x 16 chars], ...] (4 or 8 frames), mover: 'h'|'v'|'static', desc }
  // For horizontal movers (Wally & horizontal guardians) the art is authored FACING RIGHT and must fit
  // in columns 0..9 (10px wide); the engine shifts it 2px per animation frame and mirrors it for leftward motion.
  JSW.defineSprite = function (name, def) {
    if (JSW.sprites[name]) fail('duplicate sprite ' + name);
    var frames = (def.frames || []).map(function (f, i) { return parseBitmap(f, 16, 16, 'sprite ' + name + ' frame ' + i); });
    if (frames.length !== 4 && frames.length !== 8 && frames.length !== 2 && frames.length !== 1) {
      fail('sprite ' + name + ': frame count ' + frames.length + ' (expected 1, 2, 4 or 8)');
    }
    var sprite = { name: name, frames: frames, mover: def.mover || 'v', desc: def.desc || '', theme: def.theme || '' };
    if (sprite.mover === 'h') {
      frames.forEach(function (f, i) {
        f.forEach(function (row, y) {
          if (row & 0x3F) fail('sprite ' + name + ' frame ' + i + ' row ' + y + ': horizontal-mover art must fit in columns 0..9');
        });
      });
    }
    JSW.sprites[name] = sprite;
    return sprite;
  };

  // Tile pattern: { rows: [8 strings x 8 chars] , desc }
  JSW.defineTile = function (name, def) {
    if (JSW.tiles[name]) fail('duplicate tile ' + name);
    JSW.tiles[name] = { name: name, rows: parseBitmap(def.rows, 8, 8, 'tile ' + name), desc: def.desc || '', kind: def.kind || '' };
    return JSW.tiles[name];
  };

  // Item graphic: { rows: [8 strings x 8 chars], desc }
  JSW.defineItem = function (name, def) {
    if (JSW.itemGfx[name]) fail('duplicate item graphic ' + name);
    JSW.itemGfx[name] = { name: name, rows: parseBitmap(def.rows, 8, 8, 'item ' + name), desc: def.desc || '' };
    return JSW.itemGfx[name];
  };

  // Font: { glyphs: { 'A': [8 strings x 8 chars], ... } } covering printable ASCII 32..126
  JSW.fonts = JSW.fonts || {};
  JSW.defineFont = function (name, def) {
    var glyphs = {};
    Object.keys(def.glyphs || {}).forEach(function (ch) {
      glyphs[ch] = parseBitmap(def.glyphs[ch], 8, 8, 'font ' + name + " glyph '" + ch + "'");
    });
    for (var c = 32; c < 127; c++) {
      if (!glyphs[String.fromCharCode(c)]) fail('font ' + name + " missing glyph '" + String.fromCharCode(c) + "'");
    }
    JSW.fonts[name] = { name: name, glyphs: glyphs };
    return JSW.fonts[name];
  };

  JSW.defineTune = function (name, def) {
    if (JSW.tunes[name]) fail('duplicate tune ' + name);
    JSW.tunes[name] = def;
    return def;
  };

  JSW.defineRoom = function (def) {
    if (!def || !def.id) { fail('room without id'); return; }
    if (JSW.rooms[def.id]) fail('duplicate room id ' + def.id + (JSW.__file ? ' (in ' + JSW.__file + ')' : ''));
    if (JSW.__file) def.__file = JSW.__file;
    JSW.rooms[def.id] = def;
    JSW.roomOrder.push(def.id);
    return def;
  };
})(globalThis.JSW = globalThis.JSW || {});

// ZX Spectrum style display: 256x192 1-bit bitmap + 32x24 attribute cells (ink/paper/bright/flash)
// + border colour. Pure JS so it runs in the browser (canvas) and in Node (PNG previews).
(function (JSW) {
  'use strict';

  var N = 0xD7, B = 0xFF;
  // index 0-7 normal, 8-15 bright

    [0, 0, 0], [0, 0, N], [N, 0, 0], [N, 0, N], [0, N, 0], [0, N, N], [N, N, 0], [N, N, N],
    [0, 0, 0], [0, 0, B], [B, 0, 0], [B, 0, B], [0, B, 0], [0, B, B], [B, B, 0], [B, B, B],
  ];
  JSW.COLOUR = { black: 0, blue: 1, red: 2, magenta: 3, green: 4, cyan: 5, yellow: 6, white: 7 };

  // Build an attribute byte. colour args accept names or numbers.

  };

  var W = 256, H = 192;
  JSW.SCREEN_W = W; JSW.SCREEN_H = H;
  JSW.BORDER_X = 32; JSW.BORDER_Y = 24;

  function Screen() {

    this.attr = new Uint8Array(32 * 24);

  }
  Screen.prototype.clear = function (attr) {
    this.px.fill(0);
    this.attr.fill(attr == null ? 0x38 : attr);
  };
  Screen.prototype.setAttr = function (cx, cy, a) {
    if (cx >= 0 && cx < 32 && cy >= 0 && cy < 24) this.attr[cy * 32 + cx] = a;
  };
  Screen.prototype.getAttr = function (cx, cy) { return this.attr[cy * 32 + cx]; };
  Screen.prototype.plot = function (x, y, on) {
    if (x >= 0 && x < W && y >= 0 && y < H) this.px[y * W + x] = on ? 1 : 0;
  };
  // Draw an 8-pixel-wide row-bitmap glyph (array of 8 bytes) at pixel x,y. mode: 'set'|'or'|'xor'
  Screen.prototype.blit8 = function (rows, x, y, mode) {
    for (var r = 0; r < rows.length; r++) {
      var bits = rows[r], py = y + r;
      if (py < 0 || py >= H) continue;
      for (var c = 0; c < 8; c++) {
        var px = x + c; if (px < 0 || px >= W) continue;
        var on = (bits >> (7 - c)) & 1, i = py * W + px;
        if (mode === 'or') { if (on) this.px[i] = 1; }
        else if (mode === 'xor') { if (on) this.px[i] ^= 1; }
        else this.px[i] = on;
      }
    }
  };
  // Draw a 16-wide sprite frame (array of 16 row masks) with optional horizontal pixel shift & mirror.
  // Returns true if any drawn pixel landed on an already-set pixel (collision), like the original engine.
  Screen.prototype.blit16 = function (rows, x, y, opts) {
    var hit = false, mirror10 = opts && opts.mirror10, mode = (opts && opts.mode) || 'or';
    for (var r = 0; r < rows.length; r++) {
      var bits = rows[r], py = y + r;
      if (py < 0 || py >= H) continue;
      if (mirror10) bits = mirrorBits10(bits);
      for (var c = 0; c < 16; c++) {
        if (!((bits >> (15 - c)) & 1)) continue;

      }
    }
    return hit;
  };
  function mirrorBits10(bits) {

    return out;

    for (y = 0; y < OH; y++) {

// Room compiler: turns a JSW.defineRoom() definition into the runtime form used by the engine,
// the renderer and the Node validation/solver tools.

  'use strict';

      if (sym.length !== 1) { bad('legend symbol "' + sym + '" must be one character'); return; }
      if (sym === '+' || sym === '@') { bad('legend symbol "' + sym + '" is reserved'); return; }

      if (type == null) { bad('legend "' + sym + '" has unknown type ' + t.type); type = 0; }

      if (t.tile && !pat) bad('legend "' + sym + '" uses unknown tile pattern ' + t.tile);

<script>/* src/engine/willy.js */
// Wally's movement physics — a faithful re-implementation of the Jet Set Willy engine's state machine
// (routines 8DD3 "Move Willy (1)", 8ED4 "(2)", 8FBC "(3)") with the Jet Set Willy II changes adopted in docs/PLAN.md.
// Pure & headless: operates on a plain state object and an environment describing the room, so the Node solver
// runs exactly the same code as the browser game.
//
// State (all pixels):
//   col 0..30   left cell of the 2-cell-wide sprite box      frame 0..3  sub-cell step (pixel x = col*8 + frame*2)
//   y           top of the 16px sprite (stored cell-aligned on ramps; drawn lower by rampOffset)
//   facing 0=right 1=left   moving bool   airborne 0=ground 1=jumping 2..15=falling (>=12 fatal on landing)
//   jc 0..18 jump counter   rope 0=off, >0 held segment index   ropeCool frames until the rope can be grabbed again
(function (JSW) {
  'use strict';
  var T = JSW.T;

  // JSW flag table at 8421: newFlags = TABLE[flags + 4*left + 8*right], flags = facing | moving<<1
  var FLAG_TABLE = [0, 1, 0, 1, 1, 3, 1, 3, 2, 0, 2, 0, 0, 1, 2, 3];
  // Jump displacement per counter value: ((J & ~1) - 8) / 2 px
  var JUMP_DY = [];
  for (var j = 0; j < 18; j++) JUMP_DY.push(((j & ~1) - 8) / 2);
  JSW.JUMP_DY = JUMP_DY;

  JSW.newWilly = function (col, y, facing) {
    return { col: col | 0, frame: 0, y: y | 0, facing: facing | 0, moving: false, airborne: 0, jc: 0, rope: 0, ropeCool: 0 };
  };
  JSW.cloneWilly = function (w) {
    return { col: w.col, frame: w.frame, y: w.y, facing: w.facing, moving: w.moving, airborne: w.airborne, jc: w.jc, rope: w.rope, ropeCool: w.ropeCool };
  };
  JSW.willyX = function (w) { return w.col * 8 + w.frame * 2; };

  // Environment helpers. env = { room, cell(x,y) -> type (walls outside the room are reported as AIR),
  //                              ramp(x,y) -> 'left'|'right'|null, conveyor(x,y) -> 'left'|'right'|null,
  //                              forceRight, noJump, doubleSpeed }
  function isWall(env, x, y) { return env.cell(x, y) === T.WALL; }

  // Visual y offset while walking on a ramp (routine 95C8): JSW draws Willy lower than his stored, cell-aligned y.
  JSW.rampOffset = function (w, env) {
    if (w.airborne !== 0 || w.rope) return 0;
    var row = Math.floor(w.y / 8);
    if (env.ramp(w.col, row + 2) === 'left') return 2 * w.frame;
    if (env.ramp(w.col + 1, row + 2) === 'right') return 6 - 2 * w.frame;
    return 0;
  };

  // Horizontal step (8FBC). Returns 'left'/'right' when stepping off the room edge.
  function moveHoriz(w, env) {
    if (!w.moving || w.rope) return null;
    var row = Math.floor(w.y / 8), dy = 0, spans3 = (w.y % 8) !== 0, x, i;
    if (w.facing === 1) { // left
      if (w.frame > 0) { w.frame--; return null; }
      if (w.airborne === 0) {
        if (env.ramp(w.col - 1, row + 1) === 'left') dy = -1;
        else if (env.ramp(w.col + 1, row + 2) === 'right') dy = 1;
      }
      if (w.col === 0) return 'left';
      x = w.col - 1;
      for (i = 0; i < (spans3 ? 3 : 2); i++) if (isWall(env, x, row + dy + i)) return null;
      w.col--; w.y += dy * 8; w.frame = 3;
    } else {             // right
      if (w.frame < 3) { w.frame++; return null; }
      if (w.airborne === 0) {
        if (env.ramp(w.col + 2, row + 1) === 'right') dy = -1;
        else if (env.ramp(w.col, row + 2) === 'left') dy = 1;
      }
      if (w.col === 30) return 'right';
      x = w.col + 2;
      for (i = 0; i < (spans3 ? 3 : 2); i++) if (isWall(env, x, row + dy + i)) return null;
      w.col++; w.y += dy * 8; w.frame = 0;
    }
    return null;
  }

  // Ground control (8ED4): landing, conveyors, keys, jump. Returns an exit/death event or null.
  function groundControl(w, env, input) {
    var row = Math.floor(w.y / 8);
    if (!w.rope) {
      if (w.airborne >= 12) { w.airborne = 255; return 'fall'; }
      w.airborne = 0;
    }
    var left = !!input.left, right = !!input.right;
    if (!w.rope) {
      var conv = env.conveyor(w.col, row + 2) || env.conveyor(w.col + 1, row + 2);
      if (conv === 'left') left = true; else if (conv === 'right') right = true;
    }
    if (env.forceRight) { left = false; right = true; }
    var flags = w.facing | (w.moving ? 2 : 0);
    flags = FLAG_TABLE[flags + (left ? 4 : 0) + (right ? 8 : 0)];
    w.facing = flags & 1; w.moving = !!(flags & 2);

    if (input.jump && !env.noJump) {
      // JSW II: a jump pressed on a turning frame still carries Willy in the chosen direction.
      if (left !== right) { w.facing = left ? 1 : 0; w.moving = true; }
      w.jc = 0; w.airborne = 1;
      if (w.rope) {
        w.rope = 0; w.ropeCool = 16;
        w.y = Math.floor(w.y / 8) * 8;
        w.moving = true;
        return null;
      }
    }
    return moveHoriz(w, env);
  }

  // One logic frame of Willy movement (8DD3). input = {left, right, jump}.
  // Returns null or an event: 'left' | 'right' | 'up' | 'down' (room exits), 'fall' (fatal landing).
  JSW.stepWilly = function (w, env, input) {
    var ev;
    if (w.ropeCool > 0) w.ropeCool--;
    if (w.rope) return groundControl(w, env, input);

    if (w.airborne === 1) {
      w.y += JUMP_DY[w.jc];
      if (w.y < 0) return 'up';
      var top = Math.floor(w.y / 8);
      if (isWall(env, w.col, top) || isWall(env, w.col + 1, top)) {
        w.y = (top + 1) * 8;          // snap below the ceiling
        w.airborne = 2; w.moving = false;
        return null;
      }
      w.jc++;
      if (w.jc === 18) {
        w.airborne = 6;               // JSW II: no dead frame - fall through to the landing check now
      } else if (w.jc !== 13 && w.jc !== 16) {
        return moveHoriz(w, env);
      }
    }

    if (w.y % 8 === 0) {
      var r2 = w.y / 8 + 2;

// World builder: compiles every registered room and derives exits from the world grid.
// Rooms sit on an integer grid (def.pos = [col, row]); a room's left/right/up/down exit is the room in the

    if (!this.collected[id]) this.collected[id] = new Uint8Array(room.items.length);
    if (!this.visited[id]) this.visited[id] = true;

  };

  Game.prototype.env = function () {
    var env = JSW.makeEnv(this.room(), this.overlay);
    env.forceRight = this.running;
    env.noJump = this.running;
    return env;
  };

  Game.prototype.roomsVisited = function () { return Object.keys(this.visited).length; };

  Game.prototype.saveRespawn = function () {
    this.respawn = { room: this.roomId, willy: JSW.cloneWilly(this.willy) };
    this.respawn.willy.moving = false; this.respawn.willy.airborne = 0; this.respawn.willy.jc = 0;
    this.respawn.willy.rope = 0; this.respawn.willy.ropeCool = 0;
  };

  Game.prototype.kill = function (reason) {

    this.sfx.push({ type: 'die' });
  };

  Game.prototype.special = function () { return this.room().def.special || {}; };

  Game.prototype.roomCleared = function (id) {
    var c = this.collected[id || this.roomId];
    if (!c) return false;
    for (var i = 0; i < c.length; i++) if (!c[i]) return false;
    return true;
  };

  // ---- one logic frame --------------------------------------------------------------------------
  Game.prototype.update = function (input) {
    this.sfx.length = 0;
    this.tick++;
    input = input || {};
    switch (this.mode) {
      case 'play': this.updatePlay(input); break;
      case 'dying': this.updateDying(); break;
      case 'transport': this.updateTransport(); break;
      case 'gameover': this.updateGameOver(); break;
      case 'nightmare': this.updateNightmare(); break;
      case 'results': break;
    }
    return this.sfx;
  };

  Game.prototype.updatePlay = function (input) {
    var w = this.willy, sp = this.special();
    this.frames++; this.roomFrames++;
    if (this.invuln > 0) this.invuln--;
    if (this.message && --this.message.t <= 0) this.message = null;

    // 1. move rope, guardians, lifts
    var up = JSW.updateEntities(this.ents);
    for (var s = 0; s < up.sounds.length; s++) this.sfx.push({ type: up.sounds[s] });
    if (up.liftMoves.length) {
      for (var m = 0; m < up.liftMoves.length; m++) this.carryOnLift(up.liftMoves[m]);
      this.overlay = JSW.liftOverlay(this.ents);
    }

    // 2. move Willy
    var env = this.env();
    var wasAir = w.airborne;
    var ev = JSW.stepWilly(w, env, input);
    if (w.airborne === 1 && wasAir === 1) this.sfx.push({ type: 'jump', j: w.jc });
    else if (w.airborne === 1 && wasAir !== 1) this.sfx.push({ type: 'jump', j: 0 });
    else if (w.airborne > 2 && w.airborne !== 255) this.sfx.push({ type: 'fall', a: w.airborne });
    if (ev === 'fall') { this.kill('fall'); return; }
    if (!ev && w.y < 0) ev = 'up';
    if (ev === 'left' || ev === 'right' || ev === 'up' || ev === 'down') {
      if (!this.changeRoom(ev)) return;
      env = this.env();
    }

    // 3. nasties (attribute/cell based, 2x3 block)
    if (JSW.touchesNasty(w, env) && this.invuln === 0) { this.kill('nasty'); return; }

    // 4. Willy layer + guardians/arrows/rope
    JSW.drawWillyLayer(this.layer, w, env, JSW.sprites.wally);
    var col = JSW.entityCollisions(this.ents, this.layer, w, env, !!this.room().exits.up);
    if (col.dead && this.invuln === 0) { this.kill(col.dead); return; }
    if (w.rope && w.y < 0) { if (!this.changeRoom('up')) return; env = this.env(); }

    // 5. specials (housekeeper, bed, toilet, portals, switches)
    if (this.updateSpecials(sp, env)) return;

    // 6. items
    this.collectItems(env);

    // 7. respawn point: last static solid ground
    if (w.airborne === 0 && !w.rope && w.y % 8 === 0) {
      var r2 = w.y / 8 + 2;
      var a = env.cell(w.col, r2), b = env.cell(w.col + 1, r2);
      var onLift = this.overlay && (this.overlay[r2 * 32 + w.col] || this.overlay[r2 * 32 + w.col + 1]);

      // with air under both feet - saving there caused endless fall-death respawn loops)
      var supported = (a !== T.AIR || b !== T.AIR) && a !== T.NASTY && b !== T.NASTY;
      if (supported && a !== T.CONVEYOR && b !== T.CONVEYOR && !onLift && !this.running) this.saveRespawn();
    }

    // 8. music note (2 frames per note)
    if ((this.tick & 1) === 0) this.sfx.push({ type: 'note', idx: (this.tick >> 1) & 63, lives: this.lives });
  };

  Game.prototype.carryOnLift = function (mv) {
    var w = this.willy, e = mv.e;
    if (w.airborne !== 0 || w.rope || w.y % 8 !== 0) return;
    var feet = w.y / 8 + 2;
    if (feet !== mv.from) return;

  // Returns false if the move ended play this frame (death).
  Game.prototype.changeRoom = function (dir) {

      var w = this.willy;

      else if (dir === 'right') { w.col = 30; w.frame = 3; }
      else if (dir === 'up') { w.y = 0; w.airborne = 2; w.moving = false; }
      else { this.kill('void'); return false; }
      return true;

    return true;
  };

  Game.prototype.collectItems = function (env) {
    var room = this.room(), c = this.collected[this.roomId];
    if (!room.items.length) return;
    var white = JSW.willyCells(this.willy, env).white;
    for (var i = 0; i < room.items.length; i++) {
      if (c[i]) continue;
      var p = room.items[i];
      for (var k = 0; k < white.length; k++) {
        if (white[k][0] === p[0] && white[k][1] === p[1]) {

          }
          break;
        }
      }
    }
  };

  // Special room behaviours (docs/PLAN.md §3). Returns true if play for this frame ended.
  Game.prototype.updateSpecials = function (sp, env) {
    var w = this.willy;
    // housekeeper guards the bed until enough items are collected
    if (sp.housekeeper && !this.won) {
      var hk = JSW.sprites.housekeeper;
      if (hk && JSW.spriteHitsLayer(this.layer, hk.frames[0], sp.housekeeper.x * 8, sp.housekeeper.y, false) && this.invuln === 0) {
        this.kill('housekeeper'); return true;
      }
    }
    // bed: once won, standing on a right conveyor starts the run to the toilet
    if (sp.bed && this.won && !this.running && w.airborne === 0) {
      var r2 = Math.floor(w.y / 8) + 2;
      if (env.conveyor(w.col, r2) === 'right' || env.conveyor(w.col + 1, r2) === 'right') {
        this.running = true;
        this.message = { text: 'Time for bed... but first!', t: 60 };
      }
    }
    // toilet: reaching it while running ends the game
    if (sp.toilet && this.running && w.col + 1 >= sp.toilet.x && Math.abs(w.y - sp.toilet.y) < 16) {
      this.startTransport('ending', null);

          this.flags[s.flag] = true;

          this.sfx.push({ type: 'item' });

    }

        var p = sp.portals[i];
        if (!this.portalReady(p)) continue;

        var inX = w.col + 1 >= p.x && w.col <= p.x + (p.w || 2) - 1;
        var inY = feetRow - 1 >= p.y && feetRow - 1 <= p.y + (p.h || 1) - 1;

  };

  // A portal is live when its requirements are met: requires:'roomItems' (this room cleared),

  Game.prototype.portalReady = function (p) {

    if (p.requiresRooms) for (var i = 0; i < p.requiresRooms.length; i++) if (!this.roomCleared(p.requiresRooms[i]) && (this.rooms[p.requiresRooms[i]] || {}).items && this.rooms[p.requiresRooms[i]].items.length) return false;
    if (p.flag && !this.flags[p.flag]) return false;

  };

  Game.prototype.startTransport = function (kind, portal) {
    this.mode = 'transport'; this.modeTimer = 0; this.transport = { kind: kind, portal: portal };
    this.sfx.push({ type: kind === 'ending' ? 'toilet' : kind });
  };

  Game.prototype.updateTransport = function () {
    var t = this.transport, dur = t.kind === 'rocket' || t.kind === 'yacht' ? 60 : t.kind === 'ending' ? 30 : 16;
    this.modeTimer++;
    if (t.kind === 'rocket' || t.kind === 'yacht') this.sfx.push({ type: 'rumble', t: this.modeTimer });
    if (this.modeTimer < dur) return;
    if (t.kind === 'ending') {

    this.willy = JSW.newWilly(arr.x, arr.y, arr.facing === 'left' ? 1 : 0);

    JSW.stepWilly(w, env, { jump: true });
    if (w.airborne === 1) this.sfx.push({ type: 'jump', j: w.jc });
    if ((this.tick & 1) === 0) this.sfx.push({ type: 'note', idx: (this.tick >> 1) & 63, lives: 7 });
    if (this.modeTimer > 200) { this.mode = 'results'; this.modeTimer = 0; this.sfx.push({ type: 'win' }); }
  };

  Game.prototype.updateDying = function () {
    this.modeTimer++;

    this.lives--;
    if (this.lives < 0) { this.mode = 'gameover'; this.modeTimer = 0; return; }
    var r = this.respawn || this.entry;
    this.willy = JSW.cloneWilly(r.willy);
    this.enterRoom(r.room, null);
    this.mode = 'play';
    this.invuln = INVULN_FRAMES;
  };

  Game.prototype.updateGameOver = function () {
    this.modeTimer++;
    if (this.modeTimer <= 49) this.sfx.push({ type: 'gameoverStep', step: this.modeTimer });
    if (this.modeTimer > 49 + 40) this.mode = 'over';
  };

  // ---- rendering -------------------------------------------------------------------------------
  function pad(n, len) { var s = String(n); while (s.length < len) s = '0' + s; return s; }

  Game.prototype.clockText = function () {
    var secs = Math.floor(this.frames / 10);
    var h = Math.floor(secs / 3600), m = Math.floor(secs / 60) % 60, s = secs % 60;
    var colon = (this.frames % 20) < 10 || this.mode !== 'play' ? ':' : ' ';
    return pad(Math.min(h, 9999), 4) + colon + pad(m, 2) + colon + pad(s, 2);
  };

  Game.prototype.render = function (screen) {
    var room = this.room();
    screen.clear(0);
    screen.border = room.border;
    if (this.mode === 'gameover' || this.mode === 'over') { this.renderGameOver(screen); this.renderHud(screen); return; }
    if (this.mode === 'results') { this.renderResults(screen); return; }
    this.renderRoom(screen);
    this.renderHud(screen);
    if (this.mode === 'dying') {
      var ink = Math.max(0, 7 - Math.floor(this.modeTimer / 2));
      for (var i = 0; i < 512; i++) screen.attr[i] = 0x40 | ink;
    }
    if (this.mode === 'transport') this.renderTransport(screen);
  };

  Game.prototype.renderRoom = function (screen) {
    var room = this.room(), env = this.env(), w = this.willy, sp = this.special(), k;
    JSW.drawRoomTiles(screen, room, this.tick);
    if (sp.flashNasties) {
      for (k = 0; k < 512; k++) if (room.type[k] === T.NASTY) screen.attr[k] |= 0x80;
    }
    if (sp.cartography) JSW.drawCartography(screen, this);
    // flag cues: cells that start flashing once a switch flag is set (e.g. the lighthouse lamp)
    if (sp.flagFlash) sp.flagFlash.forEach(function (f) {
      if (!this.flags[f.flag]) return;
      for (var fy = f.y; fy < f.y + (f.h || 1); fy++) for (var fx = f.x; fx < f.x + (f.w || 1); fx++) {
        if (fx >= 0 && fx < 32 && fy >= 0 && fy < 16) screen.attr[fy * 32 + fx] |= 0x80;
      }
    }, this);
    // signposts: short text printed over the room (ink over the room's paper)
    if (sp.signs) sp.signs.forEach(function (s) {
      var air = room.styles[room.airStyle], ink = JSW.colourIndex(s.ink, 6);
      if (s.when && !this.flags[s.when]) return;
      JSW.printAt(screen, s.text, s.x, s.y, JSW.attr(ink, s.paper != null ? JSW.colourIndex(s.paper, 0) : air.paper, s.bright !== false, !!s.flash));
    }, this);
    // lifts drawn with the room's first floor style (or the style given)
    if (this.overlay) this.drawLifts(screen, room);
    // specials under Willy
    if (sp.toilet && JSW.sprites.toilet) {
      var tf = JSW.sprites.toilet.frames[this.running ? 1 : 0];
      screen.blit16(tf, sp.toilet.x * 8, sp.toilet.y, {});
      JSW.colourBox(screen, room, sp.toilet.x * 8, sp.toilet.y, 16, 16, 7, true);
    }
    if (sp.portals) this.drawPortals(screen, room, sp.portals);
    // Willy: recolour covered air cells white, then OR-draw (flicker while invulnerable)
    if (this.mode !== 'nightmare' || true) {
      var cells = JSW.willyCells(w, env).white;
      for (k = 0; k < cells.length; k++) {
        var cx = cells[k][0], cy = cells[k][1];
        if (cx < 0 || cx > 31 || cy < 0 || cy > 15) continue;
        if (room.type[cy * 32 + cx] === T.AIR && !(this.overlay && this.overlay[cy * 32 + cx])) {
          screen.setAttr(cx, cy, (screen.getAttr(cx, cy) & 0xF8) | 7);
        }
      }
      if (!(this.invuln > 0 && (this.tick & 2))) {
        var wy = w.y + JSW.rampOffset(w, env), pose = w.facing === 0 ? w.frame : 3 - w.frame;
        var ws = JSW.sprites.wally;
        if (ws) screen.blit16(ws.frames[pose % ws.frames.length], JSW.willyX(w), wy, { mirror10: w.facing === 1 });
      }
    }
    // housekeeper
    if (sp.housekeeper && !this.won && JSW.sprites.housekeeper) {
      var hk = JSW.sprites.housekeeper, hx = sp.housekeeper.x * 8, hy = sp.housekeeper.y;
      var hf = (w.y < hy - 8) ? 1 : ((this.tick >> 2) & 1);
      screen.blit16(hk.frames[hf % hk.frames.length], hx, hy, {});
      JSW.colourBox(screen, room, hx, hy, 16, 16, sp.housekeeper.ink == null ? 5 : JSW.colourIndex(sp.housekeeper.ink), true);
    }
    // guardians, arrows, ropes
    for (k = 0; k < this.ents.length; k++) {
      var e = this.ents[k];
      if (e.type === 'h' || e.type === 'v' || e.type === 'd') {
        var s = JSW.entitySprite(e);
        if (!s) continue;
        JSW.colourBox(screen, room, s.x, s.y, 16, 16, e.t.ink, e.t.bright);
        screen.blit16(s.rows, s.x, s.y, { mirror10: s.mirror });
      } else if (e.type === 'arrow' && e.x < 32) {
        var ax = e.x * 8, ay = e.t.y, pat = e.t.dir === 'right' ? 0x82 : 0x41;
        screen.blit8([pat, 0xFF, pat], ax, ay - 1, 'set');
        var cy2 = Math.floor(ay / 8);
        screen.setAttr(e.x, cy2, screen.getAttr(e.x, cy2) | 7);
      } else if (e.type === 'rope') {
        var segs = JSW.ropeSegments(e);
        for (var q = 0; q < segs.length; q++) screen.plot(segs[q][0], segs[q][1], 1);
      }

    JSW.drawItems(screen, room, this.collected[this.roomId], this.tick);
  };

  Game.prototype.drawLifts = function (screen, room) {
    var floorStyle = null;
    for (var i = 0; i < room.styles.length; i++) if (room.styles[i].type === T.FLOOR) { floorStyle = room.styles[i]; break; }
    for (var k = 0; k < this.ents.length; k++) {
      var e = this.ents[k];
      if (e.type !== 'lift') continue;
      for (var c = 0; c < e.t.width; c++) {
        var x = e.t.x + c;
        screen.blit8(floorStyle ? floorStyle.rows : [0xFF, 0xFF, 0, 0, 0, 0, 0, 0], x * 8, e.row * 8, 'set');
        screen.setAttr(x, e.row, floorStyle ? floorStyle.attr : 0x47);
      }
    }
  };

  Game.prototype.drawPortals = function (screen, room, portals) {
    for (var i = 0; i < portals.length; i++) {
      var p = portals[i];
      if (p.hidden) continue;
      var ready = this.portalReady(p);
      for (var c = 0; c < (p.w || 2); c++) {
        var x = p.x + c, y = p.y + (p.h || 1) - 1;
        if (x < 0 || x > 31 || y < 0 || y > 15) continue;
        if (p.kind === 'teleport') {
          // shimmering pad: flashing when ready
          screen.setAttr(x, y, (screen.getAttr(x, y) & 0x78) | ((this.tick >> 1) % 7 + 1) | (ready ? 0x80 : 0));
        }
      }
    }
  };

  Game.prototype.renderTransport = function (screen) {
    var t = this.transport, i;
    if (t.kind === 'teleport' || t.kind === 'drain' || t.kind === 'outfall') {
      for (i = 0; i < 512; i++) screen.attr[i] = (screen.attr[i] & 0xC7) | (((this.modeTimer + i) % 7 + 1) << 3);
    } else if (t.kind === 'rocket' || t.kind === 'yacht') {
      var shake = this.modeTimer & 1;
      for (i = 0; i < 512; i++) if ((i >> 5) < 16) screen.attr[i] = (screen.attr[i] & 0xF8) | (shake ? 6 : 2) | 0x40;
      JSW.printAt(screen, JSW.centre(t.kind === 'rocket' ? 'LIFT OFF!' : 'ANCHORS AWEIGH!'), 0, 7, 0x46 | 0x80);
    } else if (t.kind === 'ending') {
      for (i = 0; i < 512; i++) screen.attr[i] = 0x40 | ((this.modeTimer + (i >> 5)) & 7) << 3;
    }
  };

  Game.prototype.renderHud = function (screen) {
    var room = this.room();
    JSW.printAt(screen, JSW.centre(room.name), 0, 16, 0x07);
    for (var x = 0; x < 32; x++) { screen.setAttr(x, 17, 0); screen.setAttr(x, 18, 0); screen.setAttr(x, 20, 0); screen.setAttr(x, 21, 0); screen.setAttr(x, 23, 0); }
    JSW.printAt(screen, 'Rooms ' + pad(this.roomsVisited(), 3) + '  TIME       ' + this.clockText(), 0, 19, 0x47);
    JSW.printAt(screen, 'Items : ' + pad(this.items, 3), 16, 22, 0x46);
    var n = Math.max(0, Math.min(7, this.lives)), ws = JSW.sprites.wally, pose = (this.tick >> 2) & 3;
    for (var i = 0; i < n; i++) {
      if (ws) screen.blit16(ws.frames[pose % ws.frames.length], i * 16, 22 * 8 - 8 + 8, {});
      screen.setAttr(i * 2, 22, LIFE_ATTRS[i]); screen.setAttr(i * 2 + 1, 22, LIFE_ATTRS[i]);
      screen.setAttr(i * 2, 23, LIFE_ATTRS[i]); screen.setAttr(i * 2 + 1, 23, LIFE_ATTRS[i]);
    }
    if (this.message) JSW.printAt(screen, JSW.centre(this.message.text), 0, 17, 0x46);
  };

  Game.prototype.renderGameOver = function (screen) {
    var t = Math.min(this.modeTimer, 49), dist = t * 4;
    screen.border = 0;
    var paper = (dist >> 2) & 3;
    for (var i = 0; i < 512; i++) screen.attr[i] = 0x47 | (paper << 3);
    var ws = JSW.sprites.wally, anvil = JSW.sprites.anvil, plinth = JSW.sprites.plinth;
    if (plinth) { screen.blit16(plinth.frames[0], 15 * 8, 112, {}); for (var c = 15; c <= 16; c++) { screen.setAttr(c, 14, 0x42 | (paper << 3)); screen.setAttr(c, 15, 0x42 | (paper << 3)); } }
    if (ws) screen.blit16(ws.frames[2], 15 * 8 + 2, 96, {});
    if (anvil) {
      var ay = Math.min(dist - 16, 80);
      for (var y = 0; y < ay; y++) screen.plot(15 * 8 + 7, y, 1), screen.plot(15 * 8 + 8, y, 1);  // lengthening chain
      screen.blit16(anvil.frames[0], 15 * 8, ay, {});
    }
    if (this.modeTimer > 49) {
      var g = 'GAME', o = 'OVER';
      for (var k = 0; k < 4; k++) {
        JSW.printAt(screen, g[k], 10 + k, 6, 0x40 | ((this.modeTimer + k) % 7 + 1));
        JSW.printAt(screen, o[k], 18 + k, 6, 0x40 | ((this.modeTimer + k + 4) % 7 + 1));
      }
    }
  };

<script>/* src/data/tunes.js */
// Public-domain music, transcribed for the 1-bit beeper.
//  ingame: Edvard Grieg, "In the Hall of the Mountain King" (Peer Gynt, 1875) - 64 slots, one slot = 2 logic frames.
//  title:  Ludwig van Beethoven, Piano Sonata No. 14 "Moonlight", 1st movement opening (1801) - pairs [upper, lower]
//          played as rapid two-note alternation, the classic beeper "chord" trick.
(function (JSW) {
  'use strict';

  var HALL =
    'B3 C#4 D4 E4 F#4 D4 F#4 F#4 ' +
    'F4 C#4 F4 F4 E4 C4 E4 E4 ' +
    'B3 C#4 D4 E4 F#4 D4 F#4 B4 ' +
    'A4 F#4 D4 F#4 A4 A4 A4 A4 ' +
    'F#4 G#4 A#4 B4 C#5 A#4 C#5 C#5 ' +
    'D5 A#4 D5 D5 C#5 A#4 C#5 C#5 ' +
    'F#4 G#4 A#4 B4 C#5 A#4 C#5 F#5 ' +
    'E5 C#5 A#4 C#5 E5 E5 E5 E5';

  JSW.defineTune('ingame', { slots: JSW.parseNotes(HALL).map(function (n) { return n.n; }) });

  // Moonlight Sonata: triplet arpeggios (upper) over the bass line (lower), one pair per beat.
  var M = [];
  function bar(bass, triad, times) { for (var i = 0; i < times; i++) for (var k = 0; k < 3; k++) M.push([triad[k], bass]); }
  var n = function (s) { return JSW.parseNotes(s)[0].n; };
  bar(n('C#3'), [n('G#3'), n('C#4'), n('E4')], 4);
  bar(n('B2'), [n('G#3'), n('C#4'), n('E4')], 4);
  bar(n('A2'), [n('A3'), n('C#4'), n('E4')], 2);
  bar(n('F#2'), [n('A3'), n('D4'), n('F#4')], 2);
  bar(n('G#2'), [n('G#3'), n('C4'), n('F#4')], 1);
  bar(n('G#2'), [n('G#3'), n('C#4'), n('E4')], 1);
  bar(n('G#2'), [n('G#3'), n('C#4'), n('D#4')], 1);
  bar(n('G#2'), [n('F#3'), n('C4'), n('D#4')], 1);
  bar(n('C#3'), [n('E3'), n('G#3'), n('C#4')], 4);
  // melody enters (G#4 over the arpeggio)
  bar(n('C#3'), [n('G#3'), n('C#4'), n('G#4')], 3);
  bar(n('C#3'), [n('G#3'), n('C#4'), n('G#4')], 1);
  bar(n('B2'), [n('A3'), n('D#4'), n('A4')], 2);
  bar(n('B2'), [n('G#3'), n('D#4'), n('G#4')], 2);
  bar(n('A2'), [n('A3'), n('C#4'), n('F#4')], 2);
  bar(n('F#2'), [n('A3'), n('D4'), n('B4')], 2);
  bar(n('G#2'), [n('G#3'), n('C4'), n('E4')], 2);
  bar(n('C#3'), [n('G#3'), n('C#4'), n('E4')], 4);

  JSW.defineTune('title', { pairs: M, beat: 0.16 });
})(globalThis.JSW = globalThis.JSW || {});

</script>
<script>/* src/main.js */
// Browser boot: canvas scaling, keyboard/gamepad input, fixed-timestep loop, title/game/pause flow, sound mapping.
(function (JSW) {
  'use strict';

  var FPS = 20;                     // logic frames per second (JSW II ran ~18-25)
  var canvas, ctx, img, rgba, screen, beeper;
  var state = 'title', title, game, paused = false, lastTime = 0, acc = 0, flashClock = 0;
  var keys = {}, pressedOnce = {};
  var musicOn = true, blurPause = true;

  var LEFT = ['KeyQ', 'KeyE', 'KeyT', 'KeyU', 'KeyO', 'ArrowLeft', 'Digit5', 'Digit6'];
  var RIGHT = ['KeyW', 'KeyR', 'KeyY', 'KeyI', 'KeyP', 'ArrowRight', 'Digit7', 'Digit8'];
  var JUMP = ['KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'Space', 'ShiftLeft', 'ShiftRight', 'ArrowUp', 'Digit0'];
  var PAUSE = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG'];
  var MUSIC = ['KeyH', 'KeyJ', 'KeyK', 'KeyL'];

  function any(list) { for (var i = 0; i < list.length; i++) if (keys[list[i]]) return true; return false; }

  function gamepad() {
    var out = { left: false, right: false, jump: false, start: false };
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i]; if (!p) continue;
      var ax = p.axes[0] || 0;
      if (ax < -0.4 || (p.buttons[14] && p.buttons[14].pressed)) out.left = true;
      if (ax > 0.4 || (p.buttons[15] && p.buttons[15].pressed)) out.right = true;
      if ((p.buttons[0] && p.buttons[0].pressed) || (p.buttons[1] && p.buttons[1].pressed) || (p.buttons[12] && p.buttons[12].pressed)) out.jump = true;
      if (p.buttons[9] && p.buttons[9].pressed) out.start = true;
    }
    return out;
  }

  function readInput() {
    var gp = gamepad();
    return { left: any(LEFT) || gp.left, right: any(RIGHT) || gp.right, jump: any(JUMP) || gp.jump, start: gp.start };
  }

  function resize() {
    var w = screen.outWidth(), h = screen.outHeight();
    var s = Math.max(1, Math.floor(Math.min(window.innerWidth / w, window.innerHeight / h)));
    canvas.style.width = (w * s) + 'px';
    canvas.style.height = (h * s) + 'px';
  }

  function startGame() {
    game = new JSW.Game();
    state = 'game'; paused = false;
    beeper.silence();
  }

  function toTitle() {
    state = 'title'; title = new JSW.Title(); titleMusic.start();
  }

  // ---- title music (Moonlight Sonata, two-note alternation) -------------------------------------
  var titleMusic = {
    idx: 0, next: 0, playing: false,
    start: function () { this.idx = 0; this.next = 0; this.playing = true; title.scrollPos = -1; },
    update: function (now) {
      if (!this.playing || !beeper.ctx) return;
      var tune = JSW.tunes.title;
      if (now < this.next) return;
      if (this.idx >= tune.pairs.length) {
        // tune finished: run the scroller, then restart
        this.playing = false; title.scrollPos = 0; return;
      }
      var p = tune.pairs[this.idx++], t0 = beeper.ctx.currentTime, beat = tune.beat;
      // alternate the two notes quickly to fake a chord
      for (var k = 0; k < 6; k++) beeper.tone(k & 1, JSW.noteHz(k & 1 ? p[1] : p[0]), beat / 6 * 0.9, t0 + k * beat / 6);
      this.next = now + beat * 1000;
    },
  };

  // ---- sound effects & in-game music -----------------------------------------------------------
  function playSfx(list) {
    if (!beeper.ctx) return;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      switch (e.type) {
        case 'note':
          if (musicOn) {
            var slots = JSW.tunes.ingame.slots, n = slots[e.idx % slots.length];
            if (n != null) beeper.tone(0, JSW.noteHz(n + (e.lives - 7) * 0.5), 0.045);
          }
          break;
        case 'jump': beeper.sfx(300 + (8 - Math.abs(e.j - 8)) * 170, 0.03); break;
        case 'fall': beeper.sfx(1400 - e.a * 70, 0.03); break;
        case 'item': beeper.sweep(2600, 600, 0.03); break;
        case 'arrow': beeper.sweep(300, 3200, 0.05); break;
        case 'die': beeper.silence(); break;
        case 'dieStep': beeper.sfx(1100 - e.step * 110, 0.04); break;
        case 'gameoverStep': beeper.sfx(120 + e.step * 18, 0.03); break;
        case 'teleport': case 'drain': case 'outfall': beeper.sweep(200, 2400, 0.6); break;
        case 'rocket': case 'yacht': beeper.sweep(80, 400, 2.8); break;
        case 'rumble': break;
        case 'toilet': beeper.sweep(1500, 100, 1.2); break;
        case 'win': beeper.sweep(400, 1600, 0.8); break;
      }
    }
  }

  function logicFrame() {
    var input = readInput();
    if (state === 'title') {
      title.update();
      if (title.scrollPos >= 0 && (title.t & 1) === 0) {
        title.scrollPos++;
        if (beeper.ctx) beeper.sfx(200 + (title.scrollPos * 37) % 500, 0.02);
        if (title.scrollPos > title.message.length) titleMusic.start();
      }
      if (keys.Enter || pressedOnce.Enter || pressedOnce.NumpadEnter || input.start || pressedOnce.Digit0) { keys.Enter = false; startGame(); }
    } else if (state === 'game') {
      if (paused) return;
      var sfx = game.update(input);
      playSfx(sfx);
      if (game.mode === 'over') toTitle();
      if (game.mode === 'results' && (keys.Enter || pressedOnce.Enter || input.start)) { keys.Enter = false; toTitle(); }
    }
    pressedOnce = {};
  }

  function frame(now) {
    var dt = Math.min(250, now - (lastTime || now));
    lastTime = now; acc += dt; flashClock += dt;
    var step = 1000 / FPS;
    while (acc >= step) { logicFrame(); acc -= step; }
    if (state === 'title') titleMusic.update(now);
    // render
    if (state === 'title') title.render(screen);
    else {
      game.render(screen);
      if (paused) {
        // JSW-style pause: colours shift every second
        var shift = Math.floor(now / 1000) % 8;
        for (var i = 0; i < screen.attr.length; i++) {
          var a = screen.attr[i];
          screen.attr[i] = (a & 0x80) | ((((a >> 3) & 7) + shift * 3) % 8) << 3 | (((a & 7) + shift * 3) % 8);
        }
      }
    }
    screen.toRGBA(rgba, Math.floor(flashClock / 320) % 2 === 1);
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }

  function onKey(e, down) {
    if (down && !keys[e.code]) pressedOnce[e.code] = true;
    keys[e.code] = down;
    if (beeper) beeper.resume();
    if (!down) return;
    if (state === 'game') {
      if (PAUSE.indexOf(e.code) >= 0) { paused = true; beeper.silence(); }
      else if (paused) paused = false;
      if (MUSIC.indexOf(e.code) >= 0 || (e.code === 'Enter' && game.mode === 'play')) { musicOn = !musicOn; }
      if (e.code === 'Escape') { toTitle(); }
    }
    if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault();
  }

  JSW.boot = function () {
    canvas = document.getElementById('screen');
    screen = new JSW.Screen();
    canvas.width = screen.outWidth(); canvas.height = screen.outHeight();
    ctx = canvas.getContext('2d');
    img = ctx.createImageData(canvas.width, canvas.height);
    rgba = img.data;
    beeper = new JSW.Beeper();
    var world = JSW.buildWorld();
    if (world.problems.length) console.warn('World problems:\n' + world.problems.join('\n'));
    title = new JSW.Title();
    titleMusic.start();
    window.addEventListener('keydown', function (e) { onKey(e, true); });
    window.addEventListener('keyup', function (e) { onKey(e, false); });
    window.addEventListener('mousedown', function () { beeper.resume(); });
    window.addEventListener('resize', resize);
    window.addEventListener('blur', function () { if (!blurPause) return; keys = {}; if (state === 'game') { paused = true; if (beeper.ctx) beeper.silence(); } });
    resize();
    // debug hooks for automated testing
    JSW.debug = {
      get game() { return game; }, get state() { return state; }, get paused() { return paused; },
      startGame: startGame, resume: function () { paused = false; }, setKey: function (k, v) { keys[k] = v; },
      noBlurPause: function () { window.onblur = null; blurPause = false; },
    };
    requestAnimationFrame(frame);
  };
})(globalThis.JSW = globalThis.JSW || {});

</script>
<script>JSW.boot();</script>
</body>
